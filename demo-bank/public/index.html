<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banco Demo - Ingreso</title>
  <link rel="stylesheet" href="/estilos.css">
</head>
<body>
  <header><h1>Banco Demo</h1></header>
  <main>
    <section class="tarjeta acceso" aria-labelledby="titulo-acceso">
      <h2 id="titulo-acceso">Ingreso a la banca en linea</h2>
      <div id="mensaje" class="mensaje error oculto" role="alert" data-test="mensaje-error"></div>
      <form id="formulario-acceso" novalidate>
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input id="usuario" name="usuario" autocomplete="username" data-test="campo-usuario" required>
        </div>
        <div class="campo">
          <label for="clave">Clave</label>
          <input id="clave" name="clave" type="password" autocomplete="current-password" data-test="campo-clave" required>
        </div>
        <button type="submit" data-test="boton-ingresar">Ingresar</button>
      </form>
      <p class="pie">
        &iquest;No tiene productos con nosotros?
        <a href="/registro.html" data-test="enlace-registro">Abra su cuenta</a>
      </p>
    </section>
  </main>
  <script type="module" src="/acceso.js"></script>
</body>
</html>
